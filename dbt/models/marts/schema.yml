version: 2

models:
  # ---------------------------------------------------------------------------
  # mart_customers
  # ---------------------------------------------------------------------------
  - name: mart_customers
    description: >
      Gold layer. One clean row per unique customer per client. Duplicates and
      null source IDs are excluded. Sourced from stg_customers.
    columns:
      - name: customer_sk
        description: Surrogate key generated from (client_id, source_customer_id).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_customer_id
        tests:
          - not_null

      - name: _loaded_at
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # mart_orders
  # ---------------------------------------------------------------------------
  - name: mart_orders
    description: >
      Gold layer. One clean row per unique order per client. Duplicates and
      null source IDs are excluded. Sourced from stg_orders.
    columns:
      - name: order_sk
        description: Surrogate key generated from (client_id, source_order_id).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_order_id
        tests:
          - not_null

      - name: _loaded_at
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # mart_payments
  # ---------------------------------------------------------------------------
  - name: mart_payments
    description: >
      Gold layer. One clean row per unique payment event per client, unified
      from standalone CSV payments and payments embedded in transaction XML/JSON.
      Duplicates and null source IDs are excluded. Sourced from stg_payments.
    columns:
      - name: payment_sk
        description: Surrogate key generated from (client_id, source_payment_id).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_payment_id
        tests:
          - not_null

      - name: source_type
        tests:
          - not_null
          - accepted_values:
              values: [payments_csv, transaction_xml, transaction_json]

      - name: _loaded_at
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # mart_products
  # ---------------------------------------------------------------------------
  - name: mart_products
    description: >
      Gold layer. One clean row per unique SKU per client. Duplicates and
      null source SKUs are excluded. Sourced from stg_products.
    columns:
      - name: product_sk
        description: Surrogate key generated from (client_id, source_sku).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_sku
        tests:
          - not_null

      - name: unit_price
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number

      - name: _loaded_at
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # mart_transactions
  # ---------------------------------------------------------------------------
  - name: mart_transactions
    description: >
      Gold layer. One clean row per unique transaction per client, parsed from
      XML (Client A) and JSON (Client C) raw payloads. Duplicates and null
      source IDs are excluded. Sourced from stg_transactions.
    columns:
      - name: transaction_sk
        description: Surrogate key generated from (client_id, source_transaction_id).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_transaction_id
        tests:
          - not_null

      - name: _loaded_at
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  # mart_transaction_items
  # ---------------------------------------------------------------------------
  - name: mart_transaction_items
    description: >
      Gold layer. One clean row per line item, unnested from transaction
      payloads. Client A items from XML <Item> nodes; Client C from JSON
      items[]. Null transaction IDs and null SKUs are excluded.
      Sourced from stg_transaction_items.
    columns:
      - name: item_sk
        description: Surrogate key generated from (client_id, source_transaction_id, source_sku).
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null
          - accepted_values:
              values: [client_a, client_c]

      - name: source_transaction_id
        description: Foreign key to mart_transactions.
        tests:
          - not_null
          - relationships:
              to: ref('mart_transactions')
              field: source_transaction_id

      - name: source_sku
        tests:
          - not_null

      - name: _loaded_at
        tests:
          - not_null
